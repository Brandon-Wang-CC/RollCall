AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch alarms for RollCall Lambda error monitoring

Parameters:
  Env:
    Type: String
    Default: ""
    Description: Suffix appended to all resource names (e.g. "-test") — set in deploy-config.yaml to deploy alongside production without name collisions

Resources:

  # Fires when csvParser accumulates >= 3 errors in a 24-hour window
  CSVParserErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "Lambda1_Errors${Env}"
      AlarmDescription: !Sub >-
        csvParser${Env} has logged 3 or more errors in the past 24 hours.
        Failed messages are held in the dead-letter queue: csv-parser-dlq${Env}.
        Review them in the SQS console:
        https://console.aws.amazon.com/sqs/v3/home?region=${AWS::Region}#/queues/https%3A%2F%2Fsqs.${AWS::Region}.amazonaws.com%2F${AWS::AccountId}%2Fcsv-parser-dlq${Env}
      ActionsEnabled: true
      AlarmActions:
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:Lambda1_Error_Notif${Env}
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Sub "csvParser${Env}"
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold

  # Fires when rollcall-lambda accumulates >= 3 errors in a 24-hour window
  RollCallLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "Lambda2_Errors${Env}"
      AlarmDescription: !Sub >-
        rollcall-lambda${Env} has logged 3 or more errors in the past 24 hours.
        Failed messages are held in the dead-letter queue: rollcall-dlq-sqs${Env}.
        Review them in the SQS console:
        https://console.aws.amazon.com/sqs/v3/home?region=${AWS::Region}#/queues/https%3A%2F%2Fsqs.${AWS::Region}.amazonaws.com%2F${AWS::AccountId}%2Frollcall-dlq-sqs${Env}
      ActionsEnabled: true
      AlarmActions:
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:Lambda2_Error_Notif${Env}
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Sub "rollcall-lambda${Env}"
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
