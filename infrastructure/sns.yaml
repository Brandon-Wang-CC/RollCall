AWSTemplateFormatVersion: '2010-09-09'
Description: SNS topics for the RollCall ETL pipeline

Parameters:
  AlarmEmail:
    Type: String
    Description: Email address that receives CloudWatch alarm notifications on Lambda errors
  Env:
    Type: String
    Default: ""
    Description: Suffix appended to all resource names (e.g. "-test") — set in deploy-config.yaml to deploy alongside production without name collisions

Resources:

  # Published by SES receipt rule when email arrives; subscribed by CSV-Parser-queue
  EmailReceivedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "emailReceived${Env}"

  # Grants SES permission to publish — required for the S3 receipt rule action.
  # Must use bare Principal: "*" with no condition — SES's internal receipt-rule
  # validation rejects both Principal: {Service: ses.amazonaws.com} and any
  # Condition block (aws:SourceAccount, aws:SourceArn) with InvalidSnsTopic.
  EmailReceivedTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref EmailReceivedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SESPublish
            Effect: Allow
            Principal: "*"
            Action: SNS:Publish
            Resource: !Ref EmailReceivedTopic

  # Published by csvParser after uploading processed files; subscribed by rollcall-sqs
  DataReceivedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "dataReceived${Env}"

  # CloudWatch alarm notification for csvParser errors
  Lambda1ErrorNotifTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "Lambda1_Error_Notif${Env}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # CloudWatch alarm notification for rollcall-lambda errors
  Lambda2ErrorNotifTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "Lambda2_Error_Notif${Env}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

Outputs:
  EmailReceivedTopicArn:
    Value: !Ref EmailReceivedTopic
    Export:
      Name: !Sub "sns-emailReceived-arn${Env}"

  DataReceivedTopicArn:
    Value: !Ref DataReceivedTopic
    Export:
      Name: !Sub "sns-dataReceived-arn${Env}"
