AWSTemplateFormatVersion: '2010-09-09'
Description: S3 buckets for the RollCall ETL pipeline

Parameters:
  CsvBucket:
    Type: String
    Description: S3 bucket for processed XLSX attachments (csvParser writes, rollcall-lambda reads)
  DeptsBucket:
    Type: String
    Description: S3 bucket for reference data and output workbook
  SesBucket:
    Type: String
    Description: S3 bucket where SES delivers raw inbound emails
  Env:
    Type: String
    Default: ""
    Description: Suffix appended to all resource names (e.g. "-test") — set in deploy-config.yaml to deploy alongside production without name collisions

Resources:

  # Receives processed XLSX attachments from csvParser; read by rollcall-lambda
  RollCallCSVBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CsvBucket
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: rollcall-auto-delete-30-days
            Status: Enabled
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RollCallCSVBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RollCallCSVBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:aws:s3:::${CsvBucket}
              - !Sub arn:aws:s3:::${CsvBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Holds reference CSVs and output XLSX; S3 event on .xlsx triggers ses-emailer-function
  # Note: the Lambda notification is wired in deploy.yml after ses-emailer is deployed —
  # S3 validates the Lambda ARN exists at bucket creation time, so it cannot be declared here.
  RollCallDeptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DeptsBucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RollCallDeptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RollCallDeptsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:aws:s3:::${DeptsBucket}
              - !Sub arn:aws:s3:::${DeptsBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Raw inbound email storage; SES delivers here, csvParser reads from here
  RollCallSESBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SesBucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RollCallSESBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RollCallSESBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:aws:s3:::${SesBucket}
              - !Sub arn:aws:s3:::${SesBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  CSVBucketName:
    Value: !Ref RollCallCSVBucket
    Export:
      Name: !Ref CsvBucket

  DeptsBucketName:
    Value: !Ref RollCallDeptsBucket
    Export:
      Name: !Ref DeptsBucket

  SESBucketName:
    Value: !Ref RollCallSESBucket
    Export:
      Name: !Ref SesBucket
