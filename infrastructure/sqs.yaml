AWSTemplateFormatVersion: '2010-09-09'
Description: SQS queues for the RollCall ETL pipeline

Parameters:
  Env:
    Type: String
    Default: ""
    Description: Suffix appended to all resource names (e.g. "-test") — set in deploy-config.yaml to deploy alongside production without name collisions

Resources:

  # Dead-letter queue for CSV-Parser-queue — audit trail for failed runs (no retry)
  CSVParserDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "csv-parser-dlq${Env}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Dead-letter queue for rollcall-sqs — audit trail for failed runs (no retry)
  RollCallDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "rollcall-dlq-sqs${Env}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Main queue — receives from SNS dataReceived, triggers rollcall-lambda
  RollCallQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "rollcall-sqs${Env}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RollCallDLQ.Arn
        maxReceiveCount: 1
      SqsManagedSseEnabled: true

  RollCallQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RollCallQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSNSTopicToSendMessages
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RollCallQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:dataReceived${Env}

  # Receives from SNS emailReceived, triggers csvParser
  CSVParserQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "CSV-Parser-queue${Env}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CSVParserDLQ.Arn
        maxReceiveCount: 1
      SqsManagedSseEnabled: true

  CSVParserQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CSVParserQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOwner
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: SQS:*
            Resource: !GetAtt CSVParserQueue.Arn
          - Sid: topic-subscription-emailReceived
            Effect: Allow
            Principal:
              AWS: '*'
            Action: SQS:SendMessage
            Resource: !GetAtt CSVParserQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:emailReceived${Env}

Outputs:
  RollCallQueueArn:
    Value: !GetAtt RollCallQueue.Arn
    Export:
      Name: !Sub "rollcall-sqs-arn${Env}"

  RollCallDLQArn:
    Value: !GetAtt RollCallDLQ.Arn
    Export:
      Name: !Sub "rollcall-dlq-sqs-arn${Env}"

  CSVParserQueueArn:
    Value: !GetAtt CSVParserQueue.Arn
    Export:
      Name: !Sub "csv-parser-queue-arn${Env}"

  CSVParserDLQArn:
    Value: !GetAtt CSVParserDLQ.Arn
    Export:
      Name: !Sub "csv-parser-dlq-arn${Env}"
