AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles for all three RollCall Lambda functions

Parameters:
  CsvBucket:
    Type: String
    Description: S3 bucket for processed XLSX attachments
  DeptsBucket:
    Type: String
    Description: S3 bucket for reference data and output workbook
  SesBucket:
    Type: String
    Description: S3 bucket where SES delivers raw inbound emails
  Env:
    Type: String
    Default: ""
    Description: Suffix appended to all resource names (e.g. "-test") — set in deploy-config.yaml to deploy alongside production without name collisions

Resources:

  # ─── csvParser ───────────────────────────────────────────────────────────────

  CSVParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "csvParser-role${Env}"
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SNSANDS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: VisualEditor0
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${SesBucket}/*
                  - !Sub arn:aws:s3:::${CsvBucket}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CsvBucket}
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${CsvBucket}/*
              - Sid: VisualEditor1
                Effect: Allow
                Action: sns:Publish
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:dataReceived${Env}
        - PolicyName: SQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: VisualEditor0
                Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:CSV-Parser-queue${Env}

  # ─── rollcall-lambda ─────────────────────────────────────────────────────────

  RollCallLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "rollcall-lambda-role${Env}"
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      Policies:
        - PolicyName: RollCallS3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${CsvBucket}
                  - !Sub arn:aws:s3:::${CsvBucket}/*
                  - !Sub arn:aws:s3:::${DeptsBucket}
                  - !Sub arn:aws:s3:::${DeptsBucket}/*
        - PolicyName: SES-sendRawEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
        - PolicyName: Lambda-invoke-ses-emailer-function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ses-emailer-function${Env}

  # ─── ses-emailer-function ────────────────────────────────────────────────────

  SESEmailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ses-emailer-function-role${Env}"
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESnS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${CsvBucket}/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${DeptsBucket}/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ses-emailer-function${Env}
                Condition:
                  ArnLike:
                    AWS:SourceArn: !Sub arn:aws:s3:::${DeptsBucket}
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: '*'

  # ─── SES → S3 write role ─────────────────────────────────────────────────────

  # Assumed by SES to deliver inbound emails to the SES staging bucket
  SESWriteToS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "SESWriteToS3${Env}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: WriteToSESBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${SesBucket}/*

Outputs:
  CSVParserRoleArn:
    Value: !GetAtt CSVParserRole.Arn
    Export:
      Name: !Sub "csvParser-role-arn${Env}"

  RollCallLambdaRoleArn:
    Value: !GetAtt RollCallLambdaRole.Arn
    Export:
      Name: !Sub "rollcall-lambda-role-arn${Env}"

  SESEmailerRoleArn:
    Value: !GetAtt SESEmailerRole.Arn
    Export:
      Name: !Sub "ses-emailer-role-arn${Env}"

  SESWriteToS3RoleArn:
    Value: !GetAtt SESWriteToS3Role.Arn
    Export:
      Name: !Sub "ses-write-to-s3-role-arn${Env}"
