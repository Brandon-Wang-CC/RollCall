name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - eng
          - prod
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-${{ inputs.env || 'eng' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ── Read both config files and expose values to the deploy job ───────────────
  load-config:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      aws-region:        ${{ steps.read.outputs.aws-region }}
      oidc-role-arn:     ${{ steps.read.outputs.oidc-role-arn }}
      stack-iam:         ${{ steps.read.outputs.stack-iam }}
      stack-s3:          ${{ steps.read.outputs.stack-s3 }}
      stack-sns:         ${{ steps.read.outputs.stack-sns }}
      stack-sqs:         ${{ steps.read.outputs.stack-sqs }}
      stack-ses:         ${{ steps.read.outputs.stack-ses }}
      stack-cloudwatch:  ${{ steps.read.outputs.stack-cloudwatch }}
      stack-csv-parser:  ${{ steps.read.outputs.stack-csv-parser }}
      stack-rollcall:    ${{ steps.read.outputs.stack-rollcall }}
      stack-ses-emailer: ${{ steps.read.outputs.stack-ses-emailer }}
      csv-bucket:        ${{ steps.read.outputs.csv-bucket }}
      depts-bucket:      ${{ steps.read.outputs.depts-bucket }}
      ses-bucket:        ${{ steps.read.outputs.ses-bucket }}
      sender-domain:              ${{ steps.read.outputs.sender-domain }}
      sender-email:               ${{ steps.read.outputs.sender-email }}
      file-prefix-unfilled:       ${{ steps.read.outputs.file-prefix-unfilled }}
      file-prefix-contractor-open: ${{ steps.read.outputs.file-prefix-contractor-open }}
      file-prefix-contractor-closed: ${{ steps.read.outputs.file-prefix-contractor-closed }}
      file-prefix-candidates:     ${{ steps.read.outputs.file-prefix-candidates }}
      alarm-email:                ${{ steps.read.outputs.alarm-email }}
      md1-name:                   ${{ steps.read.outputs.md1-name }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Parse deploy-config.yaml and user-settings.yaml
        run: |
          python3 << 'EOF'
          import yaml, os, re

          def codeowners_email(path):
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#'):
                          for token in line.split()[1:]:
                              if re.match(r'^[^@]+@[^@]+\.[^@]+$', token):
                                  return token
              raise ValueError('No email found in CODEOWNERS')

          config   = yaml.safe_load(open('.github/deploy-config.yaml'))
          settings = yaml.safe_load(open('user-settings.yaml'))

          outputs = {
            'aws-region':        config['aws']['region'],
            'oidc-role-arn':     config['aws']['oidcRoleArn'],
            'stack-iam':         config['stacks']['iam'],
            'stack-s3':          config['stacks']['s3'],
            'stack-sns':         config['stacks']['sns'],
            'stack-sqs':         config['stacks']['sqs'],
            'stack-ses':         config['stacks']['ses'],
            'stack-cloudwatch':  config['stacks']['cloudwatch'],
            'stack-csv-parser':  config['stacks']['csvParser'],
            'stack-rollcall':    config['stacks']['rollcallLambda'],
            'stack-ses-emailer': config['stacks']['sesEmailer'],
            'csv-bucket':        settings['CsvBucket'],
            'depts-bucket':      settings['DeptsBucket'],
            'ses-bucket':        settings['SesBucket'],
            'sender-domain':              settings['SenderDomain'],
            'sender-email':               settings['SenderEmail'],
            'file-prefix-unfilled':       settings['FilePrefixUnfilled'],
            'file-prefix-contractor-open':  settings['FilePrefixContractorOpen'],
            'file-prefix-contractor-closed': settings['FilePrefixContractorClosed'],
            'file-prefix-candidates':     settings['FilePrefixCandidates'],
            'alarm-email':                codeowners_email('.github/CODEOWNERS'),
            'md1-name':                   settings['MD1Name'],
          }

          SPACE_ENCODED_KEYS = {
            'file-prefix-unfilled', 'file-prefix-contractor-open',
            'file-prefix-contractor-closed', 'file-prefix-candidates', 'md1-name',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            for k, v in outputs.items():
              val = str(v).replace(' ', '*') if k in SPACE_ENCODED_KEYS else str(v)
              f.write(f'{k}={val}\n')
          EOF

  # ── Deploy all stacks in dependency order, then run post-deploy steps ────────
  deploy:
    needs: load-config
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION:        ${{ needs.load-config.outputs.aws-region }}
      # For prod: ENV_SUFFIX="" and stack names have no suffix (existing prod stacks).
      # For all other envs: ENV_SUFFIX="-<env>" and stack names get the same suffix,
      # keeping each environment's CloudFormation stacks fully isolated.
      ENV_SUFFIX:        ${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      CSV_BUCKET:        ${{ needs.load-config.outputs.csv-bucket }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      DEPTS_BUCKET:      ${{ needs.load-config.outputs.depts-bucket }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      SES_BUCKET:        ${{ needs.load-config.outputs.ses-bucket }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      SENDER_DOMAIN:     ${{ needs.load-config.outputs.sender-domain }}
      SENDER_EMAIL:      ${{ needs.load-config.outputs.sender-email }}
      STACK_IAM:         ${{ needs.load-config.outputs.stack-iam }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_S3:          ${{ needs.load-config.outputs.stack-s3 }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_SNS:         ${{ needs.load-config.outputs.stack-sns }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_SQS:         ${{ needs.load-config.outputs.stack-sqs }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_SES:         ${{ needs.load-config.outputs.stack-ses }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_CLOUDWATCH:  ${{ needs.load-config.outputs.stack-cloudwatch }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_CSV_PARSER:  ${{ needs.load-config.outputs.stack-csv-parser }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_ROLLCALL:    ${{ needs.load-config.outputs.stack-rollcall }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      STACK_SES_EMAILER: ${{ needs.load-config.outputs.stack-ses-emailer }}${{ inputs.env != 'prod' && format('-{0}', inputs.env || 'eng') || '' }}
      FILE_PREFIX_UNFILLED:           ${{ needs.load-config.outputs.file-prefix-unfilled }}
      FILE_PREFIX_CONTRACTOR_OPEN:    ${{ needs.load-config.outputs.file-prefix-contractor-open }}
      FILE_PREFIX_CONTRACTOR_CLOSED:  ${{ needs.load-config.outputs.file-prefix-contractor-closed }}
      FILE_PREFIX_CANDIDATES:         ${{ needs.load-config.outputs.file-prefix-candidates }}
      ALARM_EMAIL:                    ${{ needs.load-config.outputs.alarm-email }}
      MD1_NAME:                       ${{ needs.load-config.outputs.md1-name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.load-config.outputs.oidc-role-arn }}
          aws-region:     ${{ needs.load-config.outputs.aws-region }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── Pre-flight: resolve stacks in undeployable states ────────────────────
      # Delete states: stack exists but can't be updated — remove so deploy recreates it.
      # Wait states: transient operation in progress — let it finish before deploying.
      # Fatal states (ROLLBACK_FAILED, UPDATE_ROLLBACK_FAILED, DELETE_FAILED) are left
      # alone — resources are in an unknown state and need manual intervention.

      - name: Resolve stacks in undeployable states
        run: |
          for stack in $STACK_IAM $STACK_S3 $STACK_SNS $STACK_SQS $STACK_SES $STACK_CLOUDWATCH $STACK_CSV_PARSER $STACK_ROLLCALL $STACK_SES_EMAILER; do
            status=$(aws cloudformation describe-stacks --stack-name "$stack" --region $AWS_REGION \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            case "$status" in
              ROLLBACK_COMPLETE|REVIEW_IN_PROGRESS|CREATE_FAILED)
                echo "Deleting $stack ($status)..."
                aws cloudformation delete-stack --stack-name "$stack" --region $AWS_REGION
                aws cloudformation wait stack-delete-complete --stack-name "$stack" --region $AWS_REGION
                ;;
              ROLLBACK_IN_PROGRESS)
                echo "Waiting for $stack rollback to complete..."
                aws cloudformation wait stack-rollback-complete --stack-name "$stack" --region $AWS_REGION
                echo "Deleting $stack (ROLLBACK_COMPLETE)..."
                aws cloudformation delete-stack --stack-name "$stack" --region $AWS_REGION
                aws cloudformation wait stack-delete-complete --stack-name "$stack" --region $AWS_REGION
                ;;
              UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for $stack update rollback to complete..."
                aws cloudformation wait stack-update-complete --stack-name "$stack" --region $AWS_REGION || true
                ;;
              UPDATE_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for $stack to finish cleanup..."
                aws cloudformation wait stack-update-complete --stack-name "$stack" --region $AWS_REGION
                ;;
              DELETE_IN_PROGRESS)
                echo "Waiting for $stack deletion to finish..."
                aws cloudformation wait stack-delete-complete --stack-name "$stack" --region $AWS_REGION
                ;;
              ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED)
                echo "ERROR: $stack is in $status — manual intervention required before deploying."
                exit 1
                ;;
            esac
          done

      # ── Infrastructure ────────────────────────────────────────────────────────

      - name: Deploy IAM roles
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/iam.yaml \
            --stack-name $STACK_IAM \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides CsvBucket=$CSV_BUCKET DeptsBucket=$DEPTS_BUCKET SesBucket=$SES_BUCKET SenderDomain=$SENDER_DOMAIN Env="$ENV_SUFFIX" \
            --no-fail-on-empty-changeset

      - name: Deploy S3 buckets
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/s3.yaml \
            --stack-name $STACK_S3 \
            --parameter-overrides CsvBucket=$CSV_BUCKET DeptsBucket=$DEPTS_BUCKET SesBucket=$SES_BUCKET \
            --no-fail-on-empty-changeset

      - name: Upload reference data to S3
        run: |
          aws s3 sync reference-data/ s3://$DEPTS_BUCKET/ --exact-timestamps

      - name: Deploy SNS topics
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/sns.yaml \
            --stack-name $STACK_SNS \
            --parameter-overrides AlarmEmail="$ALARM_EMAIL" Env="$ENV_SUFFIX" \
            --no-fail-on-empty-changeset

      - name: Deploy SQS queues
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/sqs.yaml \
            --stack-name $STACK_SQS \
            --parameter-overrides Env="$ENV_SUFFIX" \
            --no-fail-on-empty-changeset

      - name: Deploy SES receipt rules
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/ses.yaml \
            --stack-name $STACK_SES \
            --parameter-overrides SesBucket=$SES_BUCKET Env="$ENV_SUFFIX" \
            --no-fail-on-empty-changeset

      # ── Lambda functions ──────────────────────────────────────────────────────

      - name: SAM build
        run: |
          sam build --template lambdas/csv-parser/template.yaml      --build-dir .aws-sam/csv-parser
          sam build --template lambdas/rollcall-lambda/template.yaml  --build-dir .aws-sam/rollcall-lambda
          sam build --template lambdas/ses-emailer/template.yaml      --build-dir .aws-sam/ses-emailer

      - name: Deploy csvParser
        run: |
          sam deploy \
            --template-file .aws-sam/csv-parser/template.yaml \
            --stack-name $STACK_CSV_PARSER \
            --region $AWS_REGION \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides CsvBucket=$CSV_BUCKET Env="$ENV_SUFFIX" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Deploy rollcall-lambda
        run: |
          python3 << 'PYEOF'
          import yaml, subprocess, os, sys
          settings = yaml.safe_load(open('user-settings.yaml'))
          enc = lambda s: s.replace(' ', '*')
          result = subprocess.run([
            'sam', 'deploy',
            '--template-file', '.aws-sam/rollcall-lambda/template.yaml',
            '--stack-name',    os.environ['STACK_ROLLCALL'],
            '--region',        os.environ['AWS_REGION'],
            '--resolve-s3',
            '--capabilities',  'CAPABILITY_NAMED_IAM',
            '--parameter-overrides',
              f'CsvBucket={os.environ["CSV_BUCKET"]}',
              f'DeptsBucket={os.environ["DEPTS_BUCKET"]}',
              f'FilePrefixUnfilled={enc(settings["FilePrefixUnfilled"])}',
              f'FilePrefixContractorOpen={enc(settings["FilePrefixContractorOpen"])}',
              f'FilePrefixContractorClosed={enc(settings["FilePrefixContractorClosed"])}',
              f'FilePrefixCandidates={enc(settings["FilePrefixCandidates"])}',
              f'MD1Name={enc(settings["MD1Name"])}',
              f'Env={os.environ["ENV_SUFFIX"]}',
            '--no-confirm-changeset',
            '--no-fail-on-empty-changeset',
          ])
          sys.exit(result.returncode)
          PYEOF

      - name: Deploy ses-emailer
        run: |
          sam deploy \
            --template-file .aws-sam/ses-emailer/template.yaml \
            --stack-name $STACK_SES_EMAILER \
            --region $AWS_REGION \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides SenderEmail=$SENDER_EMAIL DeptsBucket=$DEPTS_BUCKET Env="$ENV_SUFFIX" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Wire DeptsBucket → ses-emailer after the Lambda exists.
      # S3 validates the Lambda ARN at bucket-creation time, so the notification
      # cannot live in s3.yaml (which deploys before any Lambda stack).
      - name: Wire DeptsBucket S3 notification to ses-emailer
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          LAMBDA_ARN="arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:ses-emailer-function${ENV_SUFFIX}"

          aws lambda add-permission \
            --function-name "ses-emailer-function${ENV_SUFFIX}" \
            --statement-id "s3-depts-trigger" \
            --action lambda:InvokeFunction \
            --principal s3.amazonaws.com \
            --source-arn "arn:aws:s3:::${DEPTS_BUCKET}" \
            --region $AWS_REGION 2>/dev/null || true

          aws s3api put-bucket-notification-configuration \
            --bucket "$DEPTS_BUCKET" \
            --notification-configuration "{\"LambdaFunctionConfigurations\":[{\"LambdaFunctionArn\":\"${LAMBDA_ARN}\",\"Events\":[\"s3:ObjectCreated:Put\"],\"Filter\":{\"Key\":{\"FilterRules\":[{\"Name\":\"Suffix\",\"Value\":\"xlsx\"}]}}}]}"

      # ── CloudWatch alarms ─────────────────────────────────────────────────────

      - name: Deploy CloudWatch alarms
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudwatch.yaml \
            --stack-name $STACK_CLOUDWATCH \
            --parameter-overrides Env="$ENV_SUFFIX" \
            --no-fail-on-empty-changeset

      # ── Post-deploy ───────────────────────────────────────────────────────────

      # NOTE: This step only runs for prod. For non-prod environments (eng, test),
      # the rule set is deployed but NOT activated — SES only allows one active rule
      # set at a time, so activating eng/test would take prod offline.
      # To test a non-prod pipeline, manually activate its rule set:
      #   aws ses set-active-receipt-rule-set --rule-set-name DeliverToS3-<env> --region <region>
      # Remember to reactivate prod (DeliverToS3) when done.
      - name: Activate SES receipt rule set
        if: inputs.env == 'prod'
        run: |
          aws ses set-active-receipt-rule-set \
            --rule-set-name "DeliverToS3${ENV_SUFFIX}" \
            --region $AWS_REGION
