name: Snapshot

# Captures the configuration of all live RollCall AWS resources as a
# 90-day artifact. Run this before any test deploy to create a restore point.
#
# The existing RollCall infrastructure was deployed manually (not via
# CloudFormation), so this workflow describes the raw resource configs
# rather than CloudFormation stack templates.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      aws-region:    ${{ steps.read.outputs.aws-region }}
      oidc-role-arn: ${{ steps.read.outputs.oidc-role-arn }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Parse deploy-config.yaml
        run: |
          python3 << 'EOF'
          import yaml, os

          config = yaml.safe_load(open('.github/deploy-config.yaml'))

          outputs = {
            'aws-region':    config['aws']['region'],
            'oidc-role-arn': config['aws']['oidcRoleArn'],
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            for k, v in outputs.items():
              f.write(f'{k}={v}\n')
          EOF

  snapshot:
    needs: load-config
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ needs.load-config.outputs.aws-region }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.load-config.outputs.oidc-role-arn }}
          aws-region:     ${{ needs.load-config.outputs.aws-region }}

      - name: Snapshot Lambda functions
        run: |
          mkdir -p snapshot/lambda snapshot/sqs snapshot/sns snapshot/ses
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "SNAPSHOT_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

          for FN in rollcall-lambda csvParser ses-emailer-function; do
            echo "Lambda: $FN"
            aws lambda get-function-configuration \
              --function-name "$FN" --region "$AWS_REGION" \
              > "snapshot/lambda/${FN}.json" 2>/dev/null \
              || echo "  $FN not found, skipping."
          done

      - name: Snapshot SQS queues
        run: |
          for QUEUE in CSV-Parser-queue rollcall-sqs rollcall-dlq-sqs; do
            echo "SQS: $QUEUE"
            URL=$(aws sqs get-queue-url --queue-name "$QUEUE" --region "$AWS_REGION" \
                  --query QueueUrl --output text 2>/dev/null) || { echo "  $QUEUE not found, skipping."; continue; }
            aws sqs get-queue-attributes \
              --queue-url "$URL" \
              --attribute-names All \
              --region "$AWS_REGION" \
              > "snapshot/sqs/${QUEUE}.json"
          done

      - name: Snapshot SNS topics
        run: |
          for TOPIC in dataReceived emailReceived Lambda1_Error_Notif Lambda2_Error_Notif; do
            echo "SNS: $TOPIC"
            ARN="arn:aws:sns:${AWS_REGION}:$(aws sts get-caller-identity --query Account --output text):${TOPIC}"
            aws sns get-topic-attributes \
              --topic-arn "$ARN" \
              --region "$AWS_REGION" \
              > "snapshot/sns/${TOPIC}.json" 2>/dev/null \
              || echo "  $TOPIC not found, skipping."
            aws sns list-subscriptions-by-topic \
              --topic-arn "$ARN" \
              --region "$AWS_REGION" \
              > "snapshot/sns/${TOPIC}-subscriptions.json" 2>/dev/null || true
          done

      - name: Snapshot SES rule sets
        run: |
          aws ses list-receipt-rule-sets --region "$AWS_REGION" \
            > snapshot/ses/rule-sets-list.json

          aws ses get-active-receipt-rule-set --region "$AWS_REGION" \
            > snapshot/ses/active-rule-set.json 2>/dev/null || true

          for RULESET in DeliverToS3 test; do
            echo "SES rule set: $RULESET"
            aws ses describe-receipt-rule-set \
              --rule-set-name "$RULESET" \
              --region "$AWS_REGION" \
              > "snapshot/ses/rule-set-${RULESET}.json" 2>/dev/null \
              || echo "  $RULESET not found, skipping."
          done

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rollcall-snapshot-${{ env.SNAPSHOT_TIMESTAMP }}
          path: snapshot/
          retention-days: 90
