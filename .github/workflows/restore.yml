name: Restore

# Redeploys all stacks from a previously captured snapshot artifact.
# Run the Snapshot workflow first, then find artifact names under
# Actions → that run → Artifacts.
#
# Lambda stacks restore successfully as long as the SAM-managed S3
# artifact bucket has not been manually cleared since the snapshot was taken.

on:
  workflow_dispatch:
    inputs:
      artifact-name:
        description: 'Snapshot artifact name (e.g. rollcall-snapshot-20260606T120000Z). Leave empty to use the most recent snapshot.'
        required: false
        default: ''

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      aws-region:        ${{ steps.read.outputs.aws-region }}
      oidc-role-arn:     ${{ steps.read.outputs.oidc-role-arn }}
      stack-iam:         ${{ steps.read.outputs.stack-iam }}
      stack-s3:          ${{ steps.read.outputs.stack-s3 }}
      stack-sns:         ${{ steps.read.outputs.stack-sns }}
      stack-sqs:         ${{ steps.read.outputs.stack-sqs }}
      stack-ses:         ${{ steps.read.outputs.stack-ses }}
      stack-cloudwatch:  ${{ steps.read.outputs.stack-cloudwatch }}
      stack-csv-parser:  ${{ steps.read.outputs.stack-csv-parser }}
      stack-rollcall:    ${{ steps.read.outputs.stack-rollcall }}
      stack-ses-emailer: ${{ steps.read.outputs.stack-ses-emailer }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Parse deploy-config.yaml
        run: |
          python3 << 'EOF'
          import yaml, os

          config = yaml.safe_load(open('.github/deploy-config.yaml'))

          outputs = {
            'aws-region':        config['aws']['region'],
            'oidc-role-arn':     config['aws']['oidcRoleArn'],
            'stack-iam':         config['stacks']['iam'],
            'stack-s3':          config['stacks']['s3'],
            'stack-sns':         config['stacks']['sns'],
            'stack-sqs':         config['stacks']['sqs'],
            'stack-ses':         config['stacks']['ses'],
            'stack-cloudwatch':  config['stacks']['cloudwatch'],
            'stack-csv-parser':  config['stacks']['csvParser'],
            'stack-rollcall':    config['stacks']['rollcallLambda'],
            'stack-ses-emailer': config['stacks']['sesEmailer'],
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            for k, v in outputs.items():
              f.write(f'{k}={v}\n')
          EOF

  restore:
    needs: load-config
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION:        ${{ needs.load-config.outputs.aws-region }}
      STACK_IAM:         ${{ needs.load-config.outputs.stack-iam }}
      STACK_S3:          ${{ needs.load-config.outputs.stack-s3 }}
      STACK_SNS:         ${{ needs.load-config.outputs.stack-sns }}
      STACK_SQS:         ${{ needs.load-config.outputs.stack-sqs }}
      STACK_SES:         ${{ needs.load-config.outputs.stack-ses }}
      STACK_CLOUDWATCH:  ${{ needs.load-config.outputs.stack-cloudwatch }}
      STACK_CSV_PARSER:  ${{ needs.load-config.outputs.stack-csv-parser }}
      STACK_ROLLCALL:    ${{ needs.load-config.outputs.stack-rollcall }}
      STACK_SES_EMAILER: ${{ needs.load-config.outputs.stack-ses-emailer }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.load-config.outputs.oidc-role-arn }}
          aws-region:     ${{ needs.load-config.outputs.aws-region }}

      # ── List available snapshots for reference ────────────────────────────────

      - name: List available snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Available snapshots (newest first):"
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
                  | select(.name | startswith("rollcall-snapshot-"))
                  | select(.expired == false)
                  | "\(.created_at)  \(.name)"' \
            | sort -r

      # ── Download snapshot ─────────────────────────────────────────────────────

      - name: Download snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT="${{ inputs.artifact-name }}"

          if [ -z "$ARTIFACT" ]; then
            ARTIFACT=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[]
                     | select(.name | startswith("rollcall-snapshot-"))
                     | select(.expired == false)]
                   | sort_by(.created_at) | last | .name')
            echo "No artifact specified — using most recent: $ARTIFACT"
          fi

          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq --arg name "$ARTIFACT" \
            '[.artifacts[] | select(.name == $name) | select(.expired == false)] | last | .id')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: artifact '$ARTIFACT' not found or has expired."
            exit 1
          fi

          echo "Downloading artifact ID $ARTIFACT_ID ($ARTIFACT)..."
          mkdir -p snapshot
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > snapshot.zip
          unzip -q snapshot.zip -d snapshot
          echo "Snapshot ready."

      # ── Restore all stacks in dependency order ────────────────────────────────

      - name: Restore stacks
        run: |
          python3 << 'EOF'
          import json, subprocess, os, sys

          region = os.environ['AWS_REGION']

          # Dependency order — same as deploy
          stacks = [
            os.environ['STACK_IAM'],
            os.environ['STACK_S3'],
            os.environ['STACK_SNS'],
            os.environ['STACK_SQS'],
            os.environ['STACK_SES'],
            os.environ['STACK_CSV_PARSER'],
            os.environ['STACK_ROLLCALL'],
            os.environ['STACK_SES_EMAILER'],
            os.environ['STACK_CLOUDWATCH'],
          ]

          for stack in stacks:
            template = f'snapshot/{stack}-template.yaml'
            metadata_path = f'snapshot/{stack}-metadata.json'

            if not os.path.exists(template):
              print(f'[skip]    {stack} — no snapshot file')
              continue

            params = []
            capabilities = []
            if os.path.exists(metadata_path):
              with open(metadata_path) as f:
                meta = json.load(f)
              info = meta['Stacks'][0]
              params = [
                f"ParameterKey={p['ParameterKey']},ParameterValue={p['ParameterValue']}"
                for p in info.get('Parameters', [])
              ]
              capabilities = info.get('Capabilities', [])

            cmd = [
              'aws', 'cloudformation', 'deploy',
              '--template-file', template,
              '--stack-name', stack,
              '--region', region,
              '--no-fail-on-empty-changeset',
            ]
            if capabilities:
              cmd += ['--capabilities'] + capabilities
            if params:
              cmd += ['--parameter-overrides'] + params

            print(f'[restore] {stack}')
            result = subprocess.run(cmd)
            if result.returncode != 0:
              print(f'ERROR: failed to restore {stack}', file=sys.stderr)
              sys.exit(result.returncode)

          print('\nAll stacks restored.')
          EOF
